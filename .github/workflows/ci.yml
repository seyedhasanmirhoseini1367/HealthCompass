# Deployment gate — the test suite must pass before code reaches production.
#
# Until this existed, nothing ran the suite automatically: tests were executed
# by hand on a developer machine, and Railway deployed whatever was pushed.
#
# The suite is deliberately runnable with NO secrets. It needs only SECRET_KEY
# (any value), uses the SQLite fallback, and every external provider call in the
# tests is patched. Verified: 653 tests pass with all four AI provider keys
# empty, Firebase empty and no network. Keys are therefore NOT configured here —
# if a test ever starts requiring one it will fail loudly rather than silently
# skipping, which is the property that makes this a gate rather than a formality.
#
# DATABASE_URL is deliberately left UNSET, not set to "". dj_database_url
# returns {} for an empty-but-set value, which yields a database with no ENGINE
# and fails every test for a reason unrelated to the change under test.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-secret-key-not-used-for-anything-real
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      # medical_records.E001 refuses DEBUG=False without durable object storage,
      # so a deploy can never silently lose uploads. A CI runner is thrown away
      # after every job, so ephemeral media is exactly right here — and without
      # this opt-out the "Django system checks" step fails before the suite runs.
      ALLOW_EPHEMERAL_MEDIA: "True"

    steps:
      - uses: actions/checkout@v5

      # Matches the development environment the pins were verified against.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Catches the failure mode this workflow exists for: a security-critical
      # dependency going missing. parsers.py raises on a missing defusedxml, but
      # this reports it as a clear step failure instead of a stack trace buried
      # in test output.
      - name: Verify security-critical dependencies are present
        run: |
          python -c "import defusedxml; print('defusedxml', defusedxml.__version__)"
          python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Check for dependency conflicts
        run: pip check

      # Narrow on purpose — see ruff.toml. Only rules that flag runtime bugs
      # (syntax errors, undefined names, broken comparisons) are enabled, so
      # this gate is green today and a failure means something is actually
      # wrong rather than merely untidy.
      - name: Lint
        run: |
          pip install ruff==0.6.9
          ruff check .

      - name: Django system checks
        run: python manage.py check

      # A model changed without its migration is how production and the code
      # drift apart silently. Enabled once the one outstanding difference — a
      # help_text on AIModel.model_file, no SQL involved — was recorded in
      # ai_insights migration 0004.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Parallel: the suite took ~17 minutes serially, close to the job's
      # timeout. tblib lets worker processes report a failing test's traceback
      # (without it a failure surfaces as "cannot pickle 'traceback'").
      - name: Run test suite
        run: |
          pip install tblib==3.0.0
          python manage.py test apps --parallel auto --verbosity 2
