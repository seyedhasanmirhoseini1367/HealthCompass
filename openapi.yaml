      operationId: appointment_detail_get
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: appointment_detail_patch
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: appointment_detail_delete
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/ask/:
    post:
      operationId: assistant_ask
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantAnswer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/assistant/sessions/:
    get:
      operationId: assistant_sessions
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/assistant/sessions/{session_id}/:
    get:
      operationId: assistant_session_detail_get
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: assistant_session_detail_patch
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: assistant_session_detail_delete
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/stream/:
    post:
      operationId: assistant_stream
      description: |-
        JWT-authenticated SSE counterpart to `assistant_ask`, for the mobile app.

        Wraps the same RAGService.stream_ask() generator the web chat UI uses
        (apps/rag_assistant/views.py::stream_message), so the event shape is
        identical:

            data: {"type": "token",   "content": "..."}
            data: {"type": "sources", "sources": [...]}
            data: {"type": "meta",    "provider": "...", "chunks": N, "mode": "..."}
            data: {"type": "chart",   "chart": {...}}
            data: {"type": "done"}
            data: {"type": "error",   "message": "..."}
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistantQuestionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
  /api/v1/auth/account/:
    delete:
      operationId: account_delete
      description: |-
        Delete the caller's account. Requires the password, or for accounts
        without one, the token from auth/account/delete-request/.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/account/delete-request/:
    post:
      operationId: account_delete_request
      description: |-
        For accounts without a password: email a signed, 30-minute deletion
        token (and a web link). The token is then sent to DELETE auth/account/.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: change_password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
