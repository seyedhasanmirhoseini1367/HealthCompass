          description: ''
  /api/v1/care/occurrences/{id}/respond/:
    post:
      operationId: occurrence_respond
      description: |-
        Record the patient's answer to one occurrence.

        Ownership is the filter, not a check after the fact — an occurrence
        belonging to someone else is not found rather than found-and-refused.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - care
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
