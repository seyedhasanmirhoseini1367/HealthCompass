openapi: 3.0.3
info:
  title: HealthCompass API
  version: 1.0.0
  description: Mobile API. JWT bearer authentication (auth/login/, auth/refresh/).
paths:
  /api/v1/ai-models/:
    get:
      operationId: ai_models
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (20 per page).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page, at most 100.
      tags:
      - ai-models
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIModelList'
          description: ''
  /api/v1/ai-models/{slug}/:
    get:
      operationId: ai_model_detail
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - ai-models
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai-models/{slug}/run/:
    post:
      operationId: run_model
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - ai-models
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/alerts/:
    get:
      operationId: alerts_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (20 per page).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page, at most 100.
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthAlert'
          description: ''
  /api/v1/alerts/{id}/read/:
    patch:
      operationId: alert_read
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/:
