[build]
builder = "NIXPACKS"

[deploy]
startCommand = "bash startup.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

