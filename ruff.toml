# Lint configuration.
#
# Runtime-bug rules (E9, F63, F7, F82) plus three security- and Django-focused
# families: flake8-bugbear (B), bandit (S) and flake8-django (DJ). Every new
# file is held to all of them.
#
# Code that predates B/S/DJ is grandfathered through per-file ignores below,
# one line per file and rule, so the gate is green today and the list shrinks
# as files are touched. Do not add a file here to silence a NEW finding: fix it,
# or suppress the single line with `# noqa: <rule>` and a reason.
#
# NOT enabled yet: F401 (unused imports), F841 (unused locals), E711/E712.
line-length = 100

exclude = [
    ".venv",
    "staticfiles",
    "evaluation",      # local evaluation data, not part of the application
    "*/migrations/*",  # generated; style rules do not apply
]

[lint]
select = ["E9", "F63", "F7", "F82", "B", "S", "DJ"]

[lint.per-file-ignores]
# Tests: fixture passwords, asserts and deterministic randomness are the point.
"**/test_*.py" = ["S101", "S608", "S105", "S106", "S108", "S110", "S311", "B904", "B007", "S301", "S603", "S607", "S314", "S112", "B017"]
"**/tests.py" = ["S101", "S105", "S106", "S311", "B904"]
"scripts/**" = ["S", "B"]

# Grandfathered findings in code that predates B/S/DJ (2026-11 audit, prompt 3).
"apps/accounts/egress.py" = ["B904"]
"apps/accounts/management/commands/backup_database.py" = ["B904"]
"apps/accounts/models.py" = ["DJ012"]
"apps/ai_insights/forms.py" = ["B904"]
"apps/ai_insights/inference/base.py" = ["B904"]
"apps/ai_insights/inference/eeg_csv.py" = ["B904"]
"apps/ai_insights/inference/image_classifier.py" = ["B904"]
"apps/ai_insights/inference/seizure_eeg.py" = ["B904"]
"apps/ai_insights/models.py" = ["DJ012"]
"apps/ai_insights/views/icu.py" = ["S311"]            # demo data, not security
"apps/api/views/assistant.py" = ["S110"]
"apps/api/views/icu.py" = ["S311"]                    # demo data, not security
"apps/medical_records/management/commands/reconcile_orphaned_files.py" = ["S112"]
"apps/medical_records/management/commands/seed_population.py" = ["S106", "S311"]
