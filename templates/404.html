{% load static %}<!DOCTYPE html>
{# Standalone on purpose: no template inheritance, so this renders even when the
   shared layout is what failed (audit polish). #}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — HealthCompass</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/errors.css' %}">
</head>
<body>
  <main class="err">
    <p class="err-code">404</p>
    <h1>Page not found</h1>
    <p>This page does not exist or has moved.</p>
    <p><a class="err-btn" href="/">Go to the start page</a></p>
  </main>
</body>
</html>
