{% extends 'base.html' %}
{% block title %}Change Password — HealthCompass{% endblock %}
{% block content %}
<div style="max-width:440px;margin:0 auto">
  <a href="{% url 'accounts:profile' %}" style="font-size:.875rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1rem">
    <i class="fas fa-arrow-left"></i> Back to profile
  </a>
  <div class="card">
    <div class="card-body">
      <h2 style="font-size:1.15rem;font-weight:700;margin-bottom:1.5rem">🔒 Change Password</h2>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom:1rem">
          <label style="display:block;font-size:.875rem;font-weight:600;color:var(--text);margin-bottom:.35rem">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}"
                 style="width:100%;padding:.6rem .85rem;border-radius:10px;border:1.5px solid var(--border);font-size:.9rem;box-sizing:border-box;outline:none">
          {% if field.errors %}<div style="color:#dc2626;font-size:.8rem;margin-top:.25rem">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn" style="width:100%;background:var(--primary);color:white;padding:.65rem">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
