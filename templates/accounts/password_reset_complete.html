{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset — HealthCompass{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/accounts__password_reset_complete.css' %}">
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">✅</div>
    <h1 class="auth-title">Password updated!</h1>
    <p class="auth-sub">Your password has been reset successfully. You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn-login">Log in now</a>
  </div>
</div>
{% endblock %}
