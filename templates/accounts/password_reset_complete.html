{% extends 'base.html' %}
{% block title %}Password Reset — HealthCompass{% endblock %}
{% block extra_css %}
<style>
.auth-wrap{max-width:420px;margin:3rem auto}
.auth-card{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid var(--border);text-align:center}
.auth-logo{font-size:3rem;margin-bottom:1rem}
.auth-title{font-size:1.4rem;font-weight:700;margin-bottom:.5rem}
.auth-sub{color:var(--muted);font-size:.875rem;line-height:1.7;margin-bottom:1.75rem}
.btn-login{display:inline-block;padding:.65rem 2rem;background:var(--primary);color:white;border-radius:10px;font-weight:700;font-size:.95rem;text-decoration:none}
@media(max-width:500px){.auth-card{padding:1.5rem}.auth-wrap{margin:1rem auto}}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">✅</div>
    <h1 class="auth-title">Password updated!</h1>
    <p class="auth-sub">Your password has been reset successfully. You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn-login">Log in now</a>
  </div>
</div>
{% endblock %}
